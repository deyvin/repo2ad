services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3001}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Retorno do OAuth da Higgsfield na porta do host (o PORT do host não existe dentro do container).
      HF_MCP_REDIRECT_URI: ${HF_MCP_REDIRECT_URI:-http://localhost:${PORT:-3001}/higgsfield/callback}
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]

  css:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    entrypoint: []
    command: ["./bin/rails", "tailwindcss:watch[always]"]
    tty: true

volumes:
  bundle:
